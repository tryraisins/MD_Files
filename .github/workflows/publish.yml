name: Publish yeknal to npm

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # Enable only after the npm package has a matching trusted-publisher
    # connection. A missing variable keeps release events safely dormant.
    if: ${{ vars.NPM_TRUSTED_PUBLISHING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js for trusted publishing
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm trusted-publishing client
        run: npm install --global npm@11.19.1

      - name: Verify, test, and inspect package
        working-directory: yeknal-cli
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "v${version}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match package version ${version}." >&2
            exit 1
          fi
          npm ci
          npm test
          npm pack --dry-run

      - name: Publish with npm trusted publishing
        working-directory: yeknal-cli
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          local_shasum="$(npm pack --dry-run --json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s)[0].shasum))")"
          published_shasum="$(npm view "yeknal@${version}" dist.shasum 2>/dev/null || true)"
          if [[ -n "${published_shasum}" ]]; then
            if [[ "${published_shasum}" == "${local_shasum}" ]]; then
              echo "yeknal@${version} is already published with the same tarball."
              exit 0
            fi
            echo "yeknal@${version} already exists with a different tarball." >&2
            exit 1
          fi
          npm publish
